services:
  redis:
    image: redis:7-alpine
    container_name: bookmenow-redis-prod-test
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmenow-backend-prod-test
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      TZ: Europe/Madrid
    ports:
      - "3000:3000"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bookmenow-frontend-prod-test
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3000
      TZ: Europe/Madrid
    ports:
      - "3001:3001"
