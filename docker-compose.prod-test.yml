services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bookmenow-backend-prod-test
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      TZ: Europe/Madrid
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
